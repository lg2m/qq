[package]
name = "qq-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-stream.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-sigv4.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body.workspace = true
qq-reasoning.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
# Exposes the loopback test harness (`test_support`) to this package's own
# integration tests via the self dev-dependency below. Not a public API.
test-support = []

[dev-dependencies]
qq-provider = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "provider_compiler"
harness = false
